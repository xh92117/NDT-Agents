subagents:
  default_max_turns: 2
  hard_max_turns: 6
  default_timeout_ms: 30000
  hard_timeout_ms: 180000
  max_concurrent: 3
  hard_max_concurrent: 4
  max_total_per_run: 6
  hard_max_total_per_run: 10
  agents:
    - name: general
      kind: GENERAL
      description: General bounded execution path for tasks requiring no professional specialization.
      model: primary
      prompt: general
      skill_version: general-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 2
      timeout_ms: 30000
    - name: technical_qa
      kind: PROFESSIONAL
      description: Evidence-grounded technical question answering with citation and applicability checks.
      model: primary
      prompt: technical_qa
      skill_version: technical-qa-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 3
      timeout_ms: 90000
    - name: inspection_plan
      kind: PROFESSIONAL
      description: Inspection plan drafting and deterministic completeness validation.
      model: primary
      prompt: inspection_plan
      skill_version: inspection-plan-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 4
      timeout_ms: 120000
    - name: inspection_report
      kind: PROFESSIONAL
      description: Inspection report drafting with source, calculation, finding, and limitation traceability.
      model: primary
      prompt: inspection_report
      skill_version: inspection-report-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 4
      timeout_ms: 120000
    - name: data_processing
      kind: PROFESSIONAL
      description: Registered source-data processing control and result interpretation boundary.
      model: primary
      prompt: data_processing
      skill_version: data-processing-control-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 3
      timeout_ms: 120000
    - name: method_compatibility
      kind: PROFESSIONAL
      description: Method applicability and compatibility validation for registered inspection methods.
      model: primary
      prompt: method_compatibility
      skill_version: method-compatibility-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 3
      timeout_ms: 90000
    - name: knowledge
      kind: PROFESSIONAL
      description: Explicit-intent knowledge ingestion, parsing, normalization, review, and publication preparation.
      model: primary
      prompt: knowledge
      skill_version: knowledge-1.0.0
      graph_version: child-react-1.0.0
      allowed_tools: []
      max_turns: 4
      timeout_ms: 120000
