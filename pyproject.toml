[project]
name = "ndt-agents"
version = "0.1.0"
description = "Civil infrastructure NDT agent platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "cryptography==50.0.0",
    "fastapi==0.141.1",
    "jsonschema==4.26.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pgvector==0.5.0",
    "pydantic==2.13.4",
    "pyjwt[crypto]==2.13.0",
    "redis==8.1.0",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "mypy==2.3.1",
    "openpyxl==3.1.5",
    "pillow==12.3.0",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "reportlab==5.0.1",
    "ruff==0.16.4",
    "types-jsonschema==4.26.0.20260518",
    "types-openpyxl==3.1.5.20260807",
    "types-pyyaml==6.0.12.20260815",
    "types-reportlab==4.5.1.20260807",
]

[tool.uv]
package = false
required-version = "==0.11.20"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools", "tests"]
