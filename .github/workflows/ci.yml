name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          enable-cache: true

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Regenerate controlled artifacts
        run: |
          uv run python tools/generate_schemas.py
          uv run python tools/generate_fixture_catalog.py
          uv run python tools/generate_benchmarks.py
          uv run python tools/generate_sbom.py

      - name: Reject generated-file drift
        run: git diff --exit-code

      - name: Check controlled documents
        run: uv run python tools/check_controlled_docs.py

      - name: Run tests
        run: uv run pytest

      - name: Run Ruff
        run: uv run ruff check src tools tests

      - name: Run strict mypy
        run: uv run mypy

      - name: Audit Python dependencies
        env:
          PYTHONUTF8: "1"
        run: uv run pip-audit --local --progress-spinner off

      - name: Upload baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s0-baseline-${{ github.sha }}
          path: |
            schemas/v1/manifest.json
            fixtures/v1/catalog.json
            benchmarks/v1/manifest.json
            sbom/cyclonedx.v1.json
            security/personal-project-governance.v1.json
            security/license-evidence.v1.json
            security/license-decisions.v1.json
          if-no-files-found: error
          retention-days: 30
