[package]
name = "ndt-agent-desktop"
version = "0.1.0"
description = "Default-deny desktop shell for the NDT Agent platform"
edition = "2024"
rust-version = "1.98"
license = "Proprietary"
publish = false

[lib]
name = "ndt_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[lints.rust]
# MSVC reports successful import-library creation on stdout for the Tauri
# cdylib. Rust 1.98 surfaces that status text through this warning lint.
linker_messages = "allow"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
sha2 = { version = "=0.11.0" }
tauri = { version = "=2.11.5", features = [] }
uuid = { version = "=1.25.0", features = ["serde"] }
